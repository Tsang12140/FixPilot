<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f5f7" />
  <script>
    (function () {
      var seg = (location.pathname.replace(/\/+$/, '').split('/')[1] || '');
      var prefix = (seg && seg !== 'share' && seg !== 'admin' && seg !== 'mindmap') ? '/' + seg : '';
      document.write('<base href="' + (prefix ? prefix + '/' : '/') + '">');
    })();
  </script>
  <title>FixPilot 对话分享</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=3" />
  <link rel="apple-touch-icon" href="favicon.svg?v=3" />
  <style>
    :root {
      --bg: #f4f5f7; --panel: #ffffff; --text: #1d2129; --text-2: #6b7280;
      --accent: #3b6cf6; --accent-weak: #eef2ff; --accent-text: #2f55d4;
      --border: #e8eaed; --user-grad: linear-gradient(135deg, #4b7bff, #3b6cf6);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .topbar {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; gap: 10px;
      padding: 14px 20px; padding-top: calc(14px + env(safe-area-inset-top));
      background: var(--panel); border-bottom: 1px solid var(--border);
    }
    .topbar .logo { width: 32px; height: 32px; border-radius: 9px; }
    .topbar .brand { font-weight: 700; font-size: 15px; }
    .topbar .tag {
      margin-left: auto; font-size: 12px; color: var(--text-2);
      background: var(--bg); padding: 4px 10px; border-radius: 999px;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 18px 16px 60px; }
    .conv-title { font-size: 17px; font-weight: 700; margin: 4px 4px 4px; word-break: break-word; }
    .conv-meta { font-size: 12px; color: var(--text-2); margin: 4px 4px 20px; }

    .msg { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 16px; }
    .msg.user { justify-content: flex-end; }
    .avatar {
      width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      background: var(--accent-weak); overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; display: block; }
    .msg.user .avatar { background: transparent; }
    .bubble {
      padding: 11px 14px;
      font-size: 15px; line-height: 1.75;
      word-break: break-word;
      text-align: justify;
      border-radius: 16px;
      box-shadow: 0 1px 2px rgba(20,30,60,.04);
    }
    .msg.bot .bubble { background: var(--panel); border: 1px solid #eef0f3; border-radius: 4px 16px 16px 16px; }
    .msg.user .bubble { background: var(--user-grad); color: #fff; border-radius: 16px 4px 16px 16px; }
    .msg.bot .bubble.meme-card {
      width: 134px; padding: 0; overflow: hidden;
      background: #fff; border: 1px solid #e7ebf2;
      border-radius: 14px; box-shadow: 0 5px 16px rgba(32,47,76,.11);
      line-height: 0;
    }
    .msg.bot .bubble.meme-card .meme-img {
      display: block; width: 100%; height: auto; object-fit: contain;
    }
    .msg.bot.meme-msg .msg-time { margin-top: 2px; padding: 0; }


    .bubble p { margin: 0 0 10px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble .msg-img {
      display: block; max-width: 100%; max-height: 260px;
      border-radius: 8px; margin: 2px 0 8px; object-fit: contain;
    }
    .bubble .msg-img:last-child { margin-bottom: 0; }
    .bubble strong { font-weight: 650; }
    .bubble em { font-style: normal; color: var(--accent-text); }
    .bubble h1, .bubble h2, .bubble h3 { margin: 12px 0 8px; font-size: 15px; font-weight: 700; line-height: 1.4; }
    .bubble ul, .bubble ol { margin: 8px 0; padding-left: 1.5em; }
    .bubble li { margin: 5px 0; }
    .bubble blockquote {
      margin: 10px 0; padding: 9px 14px;
      background: var(--accent-weak); border-left: 3px solid var(--accent);
      border-radius: 8px; color: #4a5568; font-size: 14px;
    }
    .bubble code {
      background: #f0f1f4; padding: 1px 6px; border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .9em;
    }
    .bubble pre { background: #1e293b; color: #e2e8f0; padding: 12px 14px; border-radius: 10px; overflow-x: auto; margin: 8px 0; }
    .bubble pre code { background: transparent; color: inherit; padding: 0; }
    .msg.user .bubble code { background: rgba(255,255,255,.2); }

    .empty { text-align: center; color: var(--text-2); padding: 60px 20px; }
    .spinner { text-align: center; color: var(--text-2); padding: 60px 20px; }
    .foot { text-align: center; color: var(--text-2); font-size: 12px; margin-top: 30px; }
    .msg-time {
      font-size: 11px; color: var(--text-2); margin-top: 2px;
      padding: 0 14px; opacity: 0.7;
    }
    .msg.user .msg-time { text-align: right; }
    .msg.bot .msg-time { text-align: left; }
    .avatar { user-select: none; -webkit-user-select: none; }
    .msg-body { display: flex; flex-direction: column; max-width: 78%; flex: 1; }
    .msg.user .msg-body { align-items: flex-end; }
    .msg.user .avatar { display: flex; }
  </style>
</head>
<body>
  <div class="topbar">
    <img class="logo" src="logo.svg?v=2" alt="FixPilot" />
    <div class="brand">FixPilot</div>
    <div class="tag">对话分享</div>
  </div>
  <div class="wrap">
    <div class="spinner" id="loading">加载中...</div>
  </div>
  <script>
    const token = location.pathname.split('/').pop();
    const wrap = document.querySelector('.wrap');

    const MEME_ASSETS = {
      you_ok: '\u4f60\u6ca1\u4e8b\u5427.png', sick: '\u4f60\u75c5\u5f97\u4e0d\u8f7b.png', head_hold: '\u62b1\u5934\u65e0\u5948.png',
      face_cover: '\u6342\u8138\u65e0\u5948.png', awkward_laugh: '\u5c2c\u7b11\u65e0\u5948.png', sweat: '\u6d41\u6c57\u65e0\u5948.png',
      sweat_2: '\u6d41\u6c57\u65e0\u59482.png', cool_gun: '\u51b7\u9177\u6301\u67aa\u6307\u7740\u5bf9\u65b9.png', stop_bothering: '\u80fd\u522b\u6574\u6211\u4e86\u4e0d\uff1f.png'
    };
    function memeIdFromMessage(content) {
      const match = typeof content === 'string' && content.trim().match(/^\[MEME:([a-z_]+)\]$/);
      return match && Object.prototype.hasOwnProperty.call(MEME_ASSETS, match[1]) ? match[1] : null;
    }
    function memeSrc(memeId) {
      return 'memes/' + memeId + '.png';
    }
    function esc(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function inline(s) {
      s = esc(s);
      s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      return s;
    }
    function mdBlock(src) {
      const lines = src.split('\n');
      let out = '', inList = false, listType = '';
      const closeList = () => { if (inList) { out += '</' + listType + '>'; inList = false; } };
      for (const raw of lines) {
        const line = raw.trim();
        if (!line) { closeList(); continue; }
        let m;
        if ((m = line.match(/^(#{1,6})\s+(.*)/))) { closeList(); const lvl = m[1].length; out += '<h' + lvl + '>' + inline(m[2]) + '</h' + lvl + '>'; }
        else if (/^[-*]\s+/.test(line)) { if (!inList) { inList = true; listType = 'ul'; out += '<ul>'; } out += '<li>' + inline(line.replace(/^[-*]\s+/, '')) + '</li>'; }
        else if (/^>\s?/.test(line)) { closeList(); out += '<blockquote>' + inline(line.replace(/^>\s?/, '')) + '</blockquote>'; }
        else if ((m = line.match(/^\d+[.、)]\s*(.*)/))) { if (!inList) { inList = true; listType = 'ol'; out += '<ol>'; } out += '<li>' + inline(m[1]) + '</li>'; }
        else { closeList(); out += '<p>' + inline(line) + '</p>'; }
      }
      closeList();
      return out;
    }
    function mdToHtml(text) {
      const parts = text.split(/```/);
      let html = '';
      for (let i = 0; i < parts.length; i++) {
        if (i % 2 === 1) html += '<pre><code>' + esc(parts[i].replace(/^[a-zA-Z]+\n/, '')) + '</code></pre>';
        else html += mdBlock(parts[i]);
      }
      return html;
    }

    async function load() {
      if (!token) { wrap.innerHTML = '<div class="empty">链接无效</div>'; return; }
      try {
        const r = await fetch('api/share/' + token);
        if (!r.ok) throw new Error('not found');
        const d = await r.json();
        const msgs = d.messages || [];
        const avatarIdx = d.avatar || 1;
        let html = '<div class="conv-title">' + esc(d.title) + '</div>';
        html += '<div class="conv-meta">FixPilot 对话分享 · 只读</div>';
        if (!msgs.length) { html += '<div class="empty">暂无内容</div>'; }
        for (const m of msgs) {
          const role = m.role === 'user' ? 'user' : 'bot';
          const ts = m.created_at ? (() => {
            const d = new Date(m.created_at);
            return (isNaN(d.getTime()) ? m.created_at : ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2));
          })() : '';
          const memeId = role === 'bot' ? memeIdFromMessage(m.content) : null;
          if (memeId) {
            html += '<div class="msg bot meme-msg"><div class="avatar"><img src="logo.svg?v=2" alt="" /></div><div class="msg-body"><div class="bubble meme-card"><img class="meme-img" src="' + memeSrc(memeId) + '" alt="FixPilot meme" /></div>' + (ts ? '<div class="msg-time">' + ts + '</div>' : '') + '</div></div>';
            continue;
          }
          html += '<div class="msg ' + role + '">' +
            (role === 'bot'
              ? '<div class="avatar"><img src="logo.svg?v=2" alt="" /></div>'
              : '') +
            '<div class="msg-body">' +
            '<div class="bubble">' +
              (role === 'bot' ? mdToHtml(m.content) : (m.image ? '<img class="msg-img" src="' + esc(m.image) + '" alt="图片" />' : '') + esc(m.content)) +
            '</div>' +
            (ts ? '<div class="msg-time">' + ts + '</div>' : '') +
            '</div>' +
            (role === 'user'
              ? '<div class="avatar"><img src="avatars/' + avatarIdx + '.webp" alt="" /></div>'
              : '') +
            '</div>';
        }
        html += '<div class="foot">由 FixPilot 生成</div>';
        wrap.innerHTML = html;
      } catch (e) {
        wrap.innerHTML = '<div class="empty">分享链接不存在或已失效</div>';
      }
    }
    load();
  </script>
</body>
</html>
